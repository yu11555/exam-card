<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title></title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #e8e8e8;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

 
  .card {
    position: relative;
    width: 414px;
    height: 950px;
    background: rgb(246,246,246);
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  /* ===== 0. 顶部横幅图片 ===== */
  .top-banner {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 60px;
    z-index: 10;
  }
  .top-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ===== 1. 顶部通知栏 ===== */
  .notice-bar {
    position: absolute;
    left: 0;
    top: 60px;
    width: 100%;
    height: 66px;
    background: rgb(252,248,236);
    display: flex;
    align-items: flex-start;
    padding-left: 29px;
    padding-right: 29px;
    padding-top: 12px;
  }
  .notice-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    margin-right: 0;
    margin-top: 1px;
  }
  .notice-text {
    color: rgb(153,109,28);
    font-size: 16px;
    line-height: 1.5;
    flex: 1;
    text-indent: 1em;
    margin-left: -15px;
  }

  /* ===== 2. 绿色头部 ===== */
  .green-header {
    position: absolute;
    left: 0;
    top: 126px;
    width: 100%;
    height: 211px;
    background: url('assets/微信图片_20260526110222_1473_165.jpg') center/cover no-repeat;
  }

  /* 日期时间容器 - 左右距边缘30px */
  .date-time-box {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 6px;
    display: flex;
    align-items: center;
    gap: 0;
    z-index: 2;
    background: rgba(0,60,35,0.75);
    border-radius: 8px;
    overflow: hidden;
  }

  /* 日期 */
  .date-box {
    padding: 6px 16px;
    text-align: center;
    color: rgba(255,255,255,0.9);
    font-size: 18px;
    font-weight: 600;
    line-height: 1.5;
    white-space: nowrap;
    border-right: none;
  }

  /* 时间 */
  .time-box {
    padding: 6px 20px;
    text-align: center;
    color: #fff;
    font-size: 42px;
    margin-left: -20px;
    font-weight: 900;
    letter-spacing: 3px;
    white-space: nowrap;
  }

  /* ===== 3. 照片区域 ===== */
  .photo-box {
    position: absolute;
    left: 50%;
    top: 214px;
    transform: translateX(-50%);
    width: 45.6%;
    aspect-ratio: 5/6;
    border-radius: 4px;
    overflow: hidden;
    background: #e8e8e8;
    z-index: 3;
  }
  .photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 标题 - 照片下方 */
  .main-title {
    position: absolute;
    left: 0;
    top: 468px;
    width: 100%;
    text-align: center;
    color: rgb(52,54,60);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    z-index: 2;
  }

  /* 对勾图标 - 放在状态文字前面 */
  .check-badge {
    position: absolute;
    left: 0;
    top: 514px;
    width: 100%;
    text-align: center;
    z-index: 4;
    pointer-events: none;
  }
  .check-badge .circle {
    display: inline-block;
    width: 45px;
    height: 45px;
    background: rgb(38,137,74);
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 5px;
    position: relative;
  }
  .check-badge .check {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -55%) rotate(-45deg);
    width: 23px;
    height: 12px;
    border-left: 5px solid #fff;
    border-bottom: 5px solid #fff;
  }
  .check-badge .status-label {
    display: inline;
    font-size: 22px;
    font-weight: 400;
    color: rgb(38,137,74);
    vertical-align: middle;
  }

  /* ===== 4. 蓝色信息卡（姓名+身份证 | 考场号+座位号） ===== */
  .id-info-card {
    position: absolute;
    left: 2px;
    top: 565px;
    width: calc(100% - 4px);
    height: 128px;
    background: url('assets/11.png') center/100% 100% no-repeat;
    border-radius: 10px;
    overflow: hidden;
    z-index: 2;
  }
  /* 浅蓝色区域：姓名 + 身份证号 */
  .id-info-left {
    position: absolute;
    left: 5%;
    top: 0;
    width: 60%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .id-info-left .name {
    font-size: 24px;
    font-weight: 900;
    color: rgb(52,54,60);
    letter-spacing: 3px;
    margin-left: 5px;
    margin-top: 10px;
  }
  .id-info-left .id-num {
    font-size: 18px;
    color: rgb(102,113,117);
    margin-top: 15px;
    margin-left: -4px;
  }
  /* 深蓝色竖条区域：考场号 + 座位号 */
  .id-info-right {
    position: absolute;
    right: calc(4% + 10px);
    top: 0;
    width: 30%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }
  .id-info-right .room-item {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    line-height: 2.2;
    text-align: left;
    white-space: nowrap;
  }
  .id-info-right .room-item .room-label {
    font-weight: 200;
    opacity: 0.7;
  }
  .id-info-right .room-item .room-value {
    font-size: 22px;
    font-weight: 700;
  }

  /* ===== 5. 考点详情 (y≈81-93%) ===== */
  .exam-detail {
    position: absolute;
    left: 43px;
    top: 692px;
    width: 75%;
    font-size: 18px;
    line-height: 3.0;
    color: rgb(52,54,60);
    font-weight: 500;
    white-space: nowrap;
  }
  .exam-detail .label {
    color: rgb(123,136,139);
  }
  .footer-bar {
    position: absolute;
    bottom: 14px;
    left: 20%;
    width: 60%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgb(48,149,236), transparent);
    border-radius: 1px;
  }

  /* 可编辑字段样式提示 */
  [contenteditable="true"]:focus {
    outline: 2px dashed rgba(48,149,236,0.5);
    outline-offset: 2px;
    border-radius: 2px;
  }
  .photo-box.editable {
    cursor: pointer;
  }
  </style>
</head>
<body>

<div class="card" id="examCard">

  <!-- 0. 顶部横幅 -->
  <div class="top-banner">
    <img src="assets/9694bd23-359a-4bd2-af49-1046fcd9bb31.png" alt="">
  </div>

  <!-- 1. 顶部通知栏 -->
  <div class="notice-bar">
    <img class="notice-icon" src="assets/ScreenShot_2026-05-26_115606_167.png" alt="">
    <div class="notice-text" id="noticeText" contenteditable="true">
      完成身份核验后，凭手机的核验成功界面、准考证、有效身份证原件进入考场
    </div>
  </div>

  <!-- 2. 绿色头部 -->
  <div class="green-header">
    <div class="date-time-box">
      <div class="date-box" id="headerDate">2026年<br>05月17日</div>
      <div class="time-box" id="liveTime">--:--:--</div>
    </div>
  </div>

  <!-- 3. 照片 -->
  <div class="photo-box editable" id="photoBox" onclick="document.getElementById('photoInput').click()">
    <img src="assets/ScreenShot_2026-05-26_111203_565.png" alt="photo" id="photoImg"
         onerror="this.style.display='none';document.getElementById('photoFallback').style.display='flex';">
    <div id="photoFallback" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:36px;color:#999;background:linear-gradient(135deg,#e0e0e0,#f5f5f5);">&#x1f464;</div>
  </div>

  <!-- 标题 -->
  <div class="main-title" id="headerTitle" contenteditable="true">2026年度监理工程师考试</div>

  <!-- 6. 状态（对勾 + 文字） -->
  <div class="check-badge" id="statusText">
    <span class="circle"><span class="check"></span></span>
    <span class="status-label" contenteditable="true">身份核验成功</span>
  </div>

  <!-- 4. 蓝色信息卡（姓名+身份证 | 考场号+座位号） -->
  <div class="id-info-card">
    <div class="id-info-left" id="idInfoLeft">
      <div class="name" id="personName" contenteditable="true">胡胡胡</div>
      <div class="id-num" id="idNumber" contenteditable="true">（430304199011561788）</div>
    </div>
    <div class="id-info-right" id="idInfoRight">
      <div class="room-item" id="roomInfo" contenteditable="true"><div class="room-line" style="margin-top:0px"><span class="room-label">考场号：</span> <span class="room-value">040</span></div><div class="room-line" style="margin-top:5px"><span class="room-label">座位号：</span> <span class="room-value">08</span></div></div>
    </div>
  </div>

  <!-- 5. 考点详情 -->
  <div class="exam-detail" id="examDetail">
    <p><span class="label">考点名称：&nbsp;&nbsp;&nbsp;</span><span contenteditable="true">&nbsp;&nbsp;杭州市交通职业高级中学</span></p>
    <p><span class="label">准考证号：&nbsp;&nbsp;&nbsp;</span><span contenteditable="true">&nbsp;&nbsp;430304199011531788</span></p>
    <p><span class="label">科目：&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span style="margin-left:20px;"><span contenteditable="true">&nbsp;&nbsp;建设工程监理案例分析</span></span></p>
    <p><span class="label">认证时间：&nbsp;&nbsp;</span><span style="margin-left:5px;"><span contenteditable="true">&nbsp;&nbsp;2026年05月17日 13:31:58</span></span></p>
  </div>

</div>

<script>
  // ===== 动态时钟（毫秒级） =====
  function updateTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var s = String(now.getSeconds()).padStart(2, '0');
    var ms = String(now.getMilliseconds()).padStart(2, '0').slice(0, 2);
    document.getElementById('liveTime').textContent = h + ':' + m + ':' + s + '.' + ms;
  }
  updateTime();
  setInterval(updateTime, 40);

  // ===== 日期设为今天 =====
  (function setToday() {
    var now = new Date();
    var y = now.getFullYear();
    var m = String(now.getMonth() + 1).padStart(2, '0');
    var d = String(now.getDate()).padStart(2, '0');
    document.getElementById('headerDate').innerHTML = y + '年<br>' + m + '月' + d + '日';
  })();

  // ===== 数据修改接口 =====
  window.updateCard = function(data) {
    if (data.noticeText !== undefined)
      document.getElementById('noticeText').textContent = data.noticeText;
    if (data.title !== undefined)
      document.getElementById('headerTitle').textContent = data.title;
    if (data.name !== undefined)
      document.getElementById('personName').textContent = data.name;
    if (data.idNumber !== undefined)
      document.getElementById('idNumber').textContent = '（' + data.idNumber + '）';
    if (data.status !== undefined) {
      var label = document.querySelector('#statusText .status-label');
      if (label) label.textContent = data.status;
    }
    if (data.roomNumber !== undefined || data.seatNumber !== undefined) {
      var rn = data.roomNumber !== undefined ? data.roomNumber : '040';
      var sn = data.seatNumber !== undefined ? data.seatNumber : '08';
      document.getElementById('roomInfo').innerHTML = '<div class="room-line" style="margin-top:0px"><span class="room-label">考场号：</span> <span class="room-value">' + rn + '</span></div><div class="room-line" style="margin-top:5px"><span class="room-label">座位号：</span> <span class="room-value">' + sn + '</span></div>';
    }
    if (data.venue !== undefined || data.examNumber !== undefined || data.subject !== undefined || data.verifyTime !== undefined) {
      var detail = document.getElementById('examDetail');
      var lines = [];
      lines.push('<p><span class=\"label\">考点名称：&nbsp;&nbsp;&nbsp;</span>&nbsp;&nbsp;' + (data.venue || '杭州市交通职业高级中学') + '</p>');
      lines.push('<p><span class=\"label\">准考证号：&nbsp;&nbsp;&nbsp;</span>&nbsp;&nbsp;' + (data.examNumber || '430304199011531788') + '</p>');
      lines.push('<p><span class=\"label\">科目：&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span style=\"margin-left:20px;\">&nbsp;&nbsp;' + (data.subject || '建设工程监理案例分析') + '</span></p>');
      lines.push('<p><span class=\"label\">认证时间：&nbsp;&nbsp;</span><span style=\"margin-left:5px;\">&nbsp;&nbsp;' + (data.verifyTime || '2026年05月17日 13:31:58') + '</span></p>');
      detail.innerHTML = lines.join('');
    }
    if (data.photoUrl !== undefined) {
      document.getElementById('photoImg').src = data.photoUrl;
      document.getElementById('photoImg').style.display = '';
      document.getElementById('photoFallback').style.display = 'none';
    }
  };

  // ===== 从 URL 参数自动读取 =====
  (function readUrlParams() {
    var params = new URLSearchParams(window.location.search);
    var data = {};
    if (params.get('name')) data.name = params.get('name');
    if (params.get('idNumber')) data.idNumber = params.get('idNumber');
    if (params.get('roomNumber')) data.roomNumber = params.get('roomNumber');
    if (params.get('seatNumber')) data.seatNumber = params.get('seatNumber');
    if (params.get('venue')) data.venue = params.get('venue');
    if (params.get('examNumber')) data.examNumber = params.get('examNumber');
    if (params.get('subject')) data.subject = params.get('subject');
    if (params.get('verifyTime')) data.verifyTime = params.get('verifyTime');
    if (params.get('noticeText')) data.noticeText = params.get('noticeText');
    if (params.get('title')) data.title = params.get('title');
    if (params.get('status')) data.status = params.get('status');
    if (params.get('photoUrl')) data.photoUrl = params.get('photoUrl');
    if (Object.keys(data).length > 0) {
      updateCard(data);
    }
  })();
</script>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="var f=this.files[0];if(f){var r=new FileReader();r.onload=function(e){document.getElementById('photoImg').src=e.target.result;document.getElementById('photoImg').style.display='';document.getElementById('photoFallback').style.display='none';};r.readAsDataURL(f);}">

</body>
</html>
